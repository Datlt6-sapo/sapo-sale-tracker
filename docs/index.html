<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Check-in điểm bán</title>
<meta name="theme-color" content="#007AFF">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Check-in">
<link rel="manifest" href="./manifest.json">
<style>
  :root { --blue:#007AFF; --green:#16D865; --bg:#F0F4F9; --text:#14181A; --muted:#6B7280; --border:#E5E9F0; --red:#E5484D; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; background:var(--bg); color:var(--text); padding:24px 16px; }
  .card { background:#fff; border:1px solid var(--border); border-radius:14px; padding:22px; max-width:460px; margin:0 auto; }
  h2 { margin:0 0 6px; font-size:19px; }
  .muted { color:var(--muted); font-size:12.5px; }
  .field { margin-bottom:13px; display:flex; flex-direction:column; gap:4px; }
  .field label { font-size:12.5px; color:var(--muted); font-weight:600; }
  input, select, textarea { font-family:inherit; font-size:15px; padding:11px 12px; border-radius:9px; border:1px solid var(--border); width:100%; background:#fff; color:var(--text); }
  input:focus, select:focus, textarea:focus { outline:none; border-color:var(--blue); box-shadow:0 0 0 3px rgba(0,122,255,.15); }
  textarea { resize:vertical; }
  button { font-family:inherit; font-size:15px; font-weight:700; padding:13px; border-radius:10px; border:none; cursor:pointer; width:100%; }
  button.primary { background:var(--blue); color:#fff; }
  button.success { background:var(--green); color:#fff; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  .hidden { display:none !important; }
  #gpsStatus { margin-bottom:14px; }
  .success-card { text-align:center; }
  .success-card .icon { font-size:46px; margin-bottom:6px; }
</style>
</head>
<body>

  <div class="card" id="formCard">
    <h2>📍 Check-in điểm bán</h2>
    <p id="gpsStatus" class="muted">Đang lấy vị trí…</p>
    <form id="ciForm">
      <div class="field"><label>Tên cửa hàng</label><input id="fShop" required placeholder="VD: Tạp hoá Cô Lan"></div>
      <div class="field"><label>Ngành nghề</label>
        <select id="fType">
          <option>Đại lý</option>
          <option>Tạp hóa</option>
          <option>Siêu thị mini</option>
          <option>Nhà thuốc</option>
          <option>Quán ăn/Cà phê (HORECA)</option>
          <option>Khác</option>
        </select>
      </div>
      <div class="field"><label>Khu vực</label>
        <select id="fArea">
          <option>Đắk Lắk</option>
          <option>Gia Lai</option>
          <option>Phú Yên</option>
          <option>Quy Nhơn</option>
        </select>
      </div>
      <div class="field"><label>Phần mềm đang dùng</label>
        <select id="fSoftware">
          <option>KiotViet</option>
          <option>Sapo</option>
          <option>Haravan</option>
          <option>POS365</option>
          <option>Ohana POS</option>
          <option>Sổ tay/Excel</option>
          <option>Chưa dùng phần mềm</option>
          <option>Khác</option>
        </select>
      </div>
      <div class="field"><label>Thời gian còn lại</label>
        <select id="fTimeLeft">
          <option value="">— Không rõ —</option>
          <option>Dưới 1 tháng</option>
          <option>1-3 tháng</option>
          <option>3-6 tháng</option>
          <option>Trên 6 tháng</option>
        </select>
      </div>
      <div class="field"><label>Ghi chú</label><textarea id="fNote" rows="2" placeholder="Tình hình tại điểm bán..."></textarea></div>
      <button type="submit" class="primary" id="btnSubmit">✓ Check-in ngay</button>
    </form>
  </div>

  <div class="card success-card hidden" id="successCard">
    <div class="icon">✅</div>
    <h2>Đã check-in thành công!</h2>
    <button class="success" id="btnAgain">+ Check-in điểm khác</button>
  </div>

  <iframe name="hiddenFrame" style="display:none"></iframe>

<script>
  // Dữ liệu đổ thẳng vào Google Form này (đã tạo sẵn), Form tự lưu kết quả vào
  // Google Sheet — không có backend/server nào khác, không cần đăng nhập.
  var GOOGLE_FORM_ACTION = 'https://docs.google.com/forms/d/e/1FAIpQLSf46-i-6MdfCnSgltqIKmkPsSpyb6DTjpzBdxuCBSWwdWSlCQ/formResponse';
  var ENTRY = {
    shop: 'entry.206619534',
    type: 'entry.1784949509',
    software: 'entry.1179308414',
    timeLeft: 'entry.1267826918',
    area: 'entry.1673771205',
    note: 'entry.1211350221',
    lat: 'entry.1747791949',
    lng: 'entry.1618001601'
  };

  var coords = null;

  function initGps() {
    var status = document.getElementById('gpsStatus');
    if (!navigator.geolocation) {
      status.textContent = 'Trình duyệt không hỗ trợ định vị (vẫn check-in được, chỉ thiếu toạ độ).';
      return;
    }
    status.textContent = 'Đang lấy vị trí…';
    navigator.geolocation.getCurrentPosition(function (pos) {
      coords = { lat: pos.coords.latitude, lng: pos.coords.longitude };
      status.textContent = 'Vị trí: ' + coords.lat.toFixed(5) + ', ' + coords.lng.toFixed(5);
    }, function (err) {
      coords = null;
      status.textContent = 'Không lấy được vị trí: ' + err.message + ' (vẫn check-in được, chỉ thiếu toạ độ).';
    }, { enableHighAccuracy: true, timeout: 15000 });
  }
  initGps();

  document.getElementById('ciForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var shop = document.getElementById('fShop').value.trim();
    if (!shop) { alert('Nhập tên cửa hàng.'); return; }

    var btn = document.getElementById('btnSubmit');
    btn.disabled = true;
    btn.textContent = 'Đang lưu…';

    var params = {};
    params[ENTRY.shop] = shop;
    params[ENTRY.type] = document.getElementById('fType').value;
    params[ENTRY.software] = document.getElementById('fSoftware').value;
    params[ENTRY.timeLeft] = document.getElementById('fTimeLeft').value;
    params[ENTRY.area] = document.getElementById('fArea').value;
    params[ENTRY.note] = document.getElementById('fNote').value;
    params[ENTRY.lat] = coords ? coords.lat : '';
    params[ENTRY.lng] = coords ? coords.lng : '';

    var form = document.createElement('form');
    form.action = GOOGLE_FORM_ACTION;
    form.method = 'POST';
    form.target = 'hiddenFrame';
    Object.keys(params).forEach(function (k) {
      var input = document.createElement('input');
      input.type = 'hidden';
      input.name = k;
      input.value = params[k];
      form.appendChild(input);
    });
    document.body.appendChild(form);
    form.submit();
    form.parentNode.removeChild(form);

    setTimeout(function () {
      document.getElementById('formCard').classList.add('hidden');
      document.getElementById('successCard').classList.remove('hidden');
      btn.disabled = false;
      btn.textContent = '✓ Check-in ngay';
    }, 800);
  });

  document.getElementById('btnAgain').addEventListener('click', function () {
    document.getElementById('ciForm').reset();
    document.getElementById('successCard').classList.add('hidden');
    document.getElementById('formCard').classList.remove('hidden');
    initGps();
  });
</script>
</body>
</html>
